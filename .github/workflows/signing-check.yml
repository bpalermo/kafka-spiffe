name: signing-check

# Tests the release environment's signing secrets without publishing anything:
# the release workflow's own publisher, with in-memory signing as it uses it,
# writes the artifact to a local repository, and every signature is verified
# against the public key fetched from the keyservers Maven Central reads. Run it
# by hand (Actions > signing-check > Run workflow) after changing GPG_PRIVATE_KEY
# or GPG_PASSPHRASE, and before the first release.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release signing key: RSA 4096, sign-only, expires 2029-10-24.
  FINGERPRINT: 1AD8BBC7819C4FFC7ECB0DC08D760DEA50D2412D

jobs:
  check:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: signing-check
          repository-cache: true
          cache-save: false
      - run: bazel build --config=ci //:kafka-spiffe.publish
      - name: Sign into a local repository
        env:
          USE_IN_MEMORY_PGP_KEYS: "true"
          PGP_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PGP_SIGNING_PWD: ${{ secrets.GPG_PASSPHRASE }}
        run: MAVEN_REPO="file://${RUNNER_TEMP}/repo" bazel run --config=ci //:kafka-spiffe.publish
      - name: Verify every signature against the published key
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          for server in hkps://keyserver.ubuntu.com hkps://keys.openpgp.org; do
            gpg --batch --keyserver "${server}" --recv-keys "${FINGERPRINT}"
          done
          dir="${RUNNER_TEMP}/repo/io/github/bpalermo/kafka-spiffe/0.0.0-dev"
          count=0
          for file in "${dir}"/*.jar "${dir}"/*.pom; do
            status="$(gpg --batch --status-fd 1 --verify "${file}.asc" "${file}" 2>/dev/null)"
            if ! grep -q "^\[GNUPG:\] VALIDSIG ${FINGERPRINT} " <<<"${status}"; then
              echo "::error::${file##*/} is not signed by ${FINGERPRINT}" >&2
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "${count}" -ne 4 ]; then
            echo "::error::expected the jar, the sources, the javadoc and the POM; verified ${count}" >&2
            exit 1
          fi
          echo "${count} files signed by ${FINGERPRINT}"
