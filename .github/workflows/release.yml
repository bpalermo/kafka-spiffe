name: release

# A version tag releases the library under that number:
#
#   git tag v1.2.3 <main's tip> && git push origin v1.2.3
#
# The tag must point at main's tip. Nothing is committed: the version is written
# into each job's checkout (scripts/set-version.sh) and main stays at 0.0.0-dev.
#
# Jobs: plan (the version, and the tag checked) -> verify (every test, with the
# version in place) -> maven (Maven Central) and github-release (the jar, signed
# with cosign, as a release asset).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Refuses anything but X.Y.Z.
          scripts/set-version.sh "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Refuse a tag that is not main's tip
        run: |
          set -euo pipefail
          main="$(git rev-parse origin/main)"
          if [ "${GITHUB_SHA}" != "${main}" ]; then
            echo "::error::${GITHUB_REF_NAME} is ${GITHUB_SHA}, main is ${main}" >&2
            exit 1
          fi

  # Every test of CI, with the release version in place: the build, unit and
  # version tests, the jar beside a broker's libs/, and the end-to-end tests
  # against a real SPIRE.
  #
  # It also records the sha256 of the jar and POM, built as the release builds
  # them (--config=release), and the jobs below publish and sign only those bytes.
  verify:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      jar: ${{ steps.artifact.outputs.jar }}
      pom: ${{ steps.artifact.outputs.pom }}
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/set-version.sh "${RELEASE_VERSION}"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: release-verify
          repository-cache: true
          cache-save: false
      - run: bazel test --config=ci //...
      - run: >-
          bazel test --config=ci
          //src/test/java/io/github/bpalermo/kafka/spiffe/jar:jar_classpath_libs_3_0_test
          //src/test/java/io/github/bpalermo/kafka/spiffe/jar:jar_classpath_libs_4_4_test
      - run: bazel test --config=ci --config=e2e //...
      - name: The jar and POM the release publishes
        id: artifact
        run: |
          set -euo pipefail
          bazel build --config=ci --config=release //:kafka-spiffe-maven-artifact //:kafka-spiffe-pom
          scripts/artifact-digests.sh | tee -a "${GITHUB_OUTPUT}"

  # io.github.bpalermo:kafka-spiffe on Maven Central.
  #
  # Off until the repository variable PUBLISH_MAVEN is `true`. It needs, in the
  # `release` environment: MAVEN_USER and MAVEN_PASSWORD (a Central Portal
  # token); GPG_PRIVATE_KEY (the secret key ring, `gpg --export-secret-keys`,
  # base64-encoded) and GPG_PASSPHRASE. Signing is in memory
  # (USE_IN_MEMORY_PGP_KEYS): the publisher's gpg mode never passes a
  # passphrase, so it cannot use a protected key on a runner. The signing-check
  # workflow tests those two secrets without publishing.
  #
  # The upload goes to the Portal's staging-compatible endpoint. A deployment
  # made there reaches the Portal only when this job asks for it, and with
  # publishing_type=automatic the Portal publishes it once it validates. The job
  # then follows the deployment until it is published, so a validation that
  # fails fails the release. A version on Central cannot be removed or replaced:
  # what verify passed is what is published.
  maven:
    if: vars.PUBLISH_MAVEN == 'true'
    needs: [plan, verify]
    environment: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      STAGING: https://ossrh-staging-api.central.sonatype.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/set-version.sh "${RELEASE_VERSION}"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: release-maven
          repository-cache: true
          cache-save: false
      # Built before any credential exists on the runner, as `bazel run` builds it
      # (--config=release keeps the JDK 17 class library under `bazel run`): the
      # script it writes is what the upload runs, so nothing is built in between.
      - run: bazel run --config=ci --config=release --script_path=publish.sh //:kafka-spiffe.publish
      - name: Refuse bytes the verify job did not record
        env:
          VERIFIED_JAR: ${{ needs.verify.outputs.jar }}
          VERIFIED_POM: ${{ needs.verify.outputs.pom }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFIED_JAR}" ] || [ -z "${VERIFIED_POM}" ]; then
            echo "::error::the verify job recorded no digest" >&2
            exit 1
          fi
          expected="$(printf 'jar=%s\npom=%s' "${VERIFIED_JAR}" "${VERIFIED_POM}")"
          actual="$(scripts/artifact-digests.sh)"
          if [ "${actual}" != "${expected}" ]; then
            printf '::error::the jar or POM to publish is not the one verify built\nverify:\n%s\nhere:\n%s\n' "${expected}" "${actual}" >&2
            exit 1
          fi
          echo "${actual}"
      - name: Upload
        env:
          MAVEN_REPO: ${{ env.STAGING }}/service/local/staging/deploy/maven2/
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          USE_IN_MEMORY_PGP_KEYS: "true"
          PGP_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PGP_SIGNING_PWD: ${{ secrets.GPG_PASSPHRASE }}
        run: ./publish.sh
      # The staging API keeps an upload under the token, the namespace and the
      # runner's address, so this runs in the same job as the upload.
      - name: Hand the deployment to the Portal, and follow it until published
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          PORTAL: https://central.sonatype.com
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "${MAVEN_USER}" "${MAVEN_PASSWORD}" | base64 -w0)"
          auth="Authorization: Bearer ${token}"
          purl="pkg:maven/io.github.bpalermo/kafka-spiffe@${RELEASE_VERSION}"
          # The namespace's Portal deployments, as the staging API knows them.
          deployments() {
            curl --fail-with-body -sS -H "${auth}" \
              "${STAGING}/manual/search/repositories?ip=any&profile_id=io.github.bpalermo" |
              jq -r '.repositories[].portal_deployment_id // empty'
          }
          status() {
            curl --fail-with-body -sS -X POST -H "${auth}" "${PORTAL}/api/v1/publisher/status?id=$1"
          }

          # Those of earlier attempts, so that a release run again follows its own.
          for attempt in 1 2 3 4 5; do
            before="$(deployments)" && break
            [ "${attempt}" = 5 ] && exit 1
            sleep 10
          done
          curl --fail-with-body -sS -X POST -H "${auth}" \
            "${STAGING}/manual/upload/defaultRepository/io.github.bpalermo?publishing_type=automatic"
          echo

          # A read that fails (a 429, a 5xx, a reset connection) is tried again: the
          # Portal goes on publishing whether or not this job is watching.
          deployment=""
          for _ in $(seq 1 30); do
            for id in $(deployments || true); do
              if grep -qxF "${id}" <<<"${before}"; then
                continue
              fi
              if (status "${id}" || true) | jq -e --arg purl "${purl}" '(.purls // []) | index($purl)' >/dev/null 2>&1; then
                deployment="${id}"
              fi
            done
            [ -n "${deployment}" ] && break
            sleep 10
          done
          if [ -z "${deployment}" ]; then
            echo "::error::no new Portal deployment holds ${purl}" >&2
            exit 1
          fi
          echo "Portal deployment ${deployment}"

          # Publishing takes minutes, sometimes tens of them.
          for _ in $(seq 1 120); do
            if ! answer="$(status "${deployment}")"; then
              echo "$(date -u +%H:%M:%S) status not read; trying again"
              sleep 30
              continue
            fi
            state="$(jq -r .deploymentState <<<"${answer}")"
            echo "$(date -u +%H:%M:%S) ${state}"
            case "${state}" in
              PUBLISHED)
                echo "kafka-spiffe ${RELEASE_VERSION} is published to Maven Central."
                exit 0
                ;;
              FAILED)
                echo "::error::the Portal refused the deployment: $(jq -c '.errors // {}' <<<"${answer}")" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::deployment ${deployment} was not published within an hour; see the Central Portal" >&2
          exit 1

  # The GitHub release: the jar and its POM, each with a cosign signature
  # (keyless, from this workflow's identity), and notes generated from the pull
  # requests merged since the previous tag.
  github-release:
    needs: [plan, verify]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/set-version.sh "${RELEASE_VERSION}"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: release-github
          repository-cache: true
          cache-save: false
      - name: Build the jar and POM
        run: |
          set -euo pipefail
          bazel build --config=ci --config=release //:kafka-spiffe-maven-artifact //:kafka-spiffe-pom
          mkdir dist
          cp "$(bazel cquery --config=ci --config=release //:kafka-spiffe-maven-artifact --output=files 2>/dev/null)" "dist/kafka-spiffe-${RELEASE_VERSION}.jar"
          cp "$(bazel cquery --config=ci --config=release //:kafka-spiffe-pom --output=files 2>/dev/null)" "dist/kafka-spiffe-${RELEASE_VERSION}.pom"
          ls -l dist
      - name: Refuse bytes the verify job did not record
        env:
          VERIFIED_JAR: ${{ needs.verify.outputs.jar }}
          VERIFIED_POM: ${{ needs.verify.outputs.pom }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFIED_JAR}" ] || [ -z "${VERIFIED_POM}" ]; then
            echo "::error::the verify job recorded no digest" >&2
            exit 1
          fi
          expected="$(printf 'jar=%s\npom=%s' "${VERIFIED_JAR}" "${VERIFIED_POM}")"
          actual="$(scripts/artifact-digests.sh dist/*.jar dist/*.pom)"
          if [ "${actual}" != "${expected}" ]; then
            printf '::error::the jar or POM to sign is not the one verify built\nverify:\n%s\nhere:\n%s\n' "${expected}" "${actual}" >&2
            exit 1
          fi
          echo "${actual}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign
        run: |
          set -euo pipefail
          for file in dist/*.jar dist/*.pom; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --notes "io.github.bpalermo:kafka-spiffe:${RELEASE_VERSION}. The jar and POM attached here are the same bytes as on Maven Central, where they are signed with the release key (.asc). Each file attached here has a cosign bundle (.sigstore.json); verify with cosign verify-blob --bundle <file>.sigstore.json --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF} --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>"
